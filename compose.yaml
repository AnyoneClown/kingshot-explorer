name: ds-translator

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # One-off: applies database migrations, then exits. The bot waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging: *default-logging

  translator-bot-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-translator-bot-local
    env_file:
      - .env.local
    environment:
      BOT_INSTANCE: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Give in-flight gift-code batches time to persist on `docker stop`.
    stop_grace_period: 30s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M
    logging: *default-logging
