name: ds-translator

x-bot-common: &bot-common
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./logs:/app/logs
  restart: unless-stopped
  dns:
    - 8.8.8.8
    - 1.1.1.1
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.50"
      reservations:
        memory: 128M

services:
  translator-bot-dev:
    <<: *bot-common
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: discord-translator-bot-dev
    env_file:
      - .env
    volumes:
      - .:/app
      - ./logs:/app/logs

  translator-bot-local:
    <<: *bot-common
    container_name: discord-translator-bot-local
    env_file:
      - .env.local
    environment:
      BOT_PROFILE: local
      BOT_INSTANCE: local

  translator-bot-global:
    <<: *bot-common
    container_name: discord-translator-bot-global
    env_file:
      - .env.prod
    environment:
      BOT_PROFILE: global
      BOT_INSTANCE: global

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: ds-translator-grafana-alloy
    env_file:
      - .env.grafana
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  alloy-data:
