name: ds-translator

services:
  # One-off: applies database migrations, then exits. The bot waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    dns:
      - 8.8.8.8
      - 1.1.1.1

  translator-bot-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-translator-bot-local
    env_file:
      - .env.local
    environment:
      BOT_INSTANCE: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Give in-flight gift-code batches time to persist on `docker stop`.
    stop_grace_period: 30s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 128M

  grafana-alloy:
    image: grafana/alloy:latest
    container_name: ds-translator-grafana-alloy
    env_file:
      - .env.grafana
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    restart: unless-stopped

volumes:
  alloy-data:
