services:
  translator-bot-global:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-translator-bot-global
    env_file:
      - .env.prod
    environment:
      BOT_PROFILE: global
      BOT_INSTANCE: global
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.50'
        reservations:
          memory: 128M
