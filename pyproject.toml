[project]
name = "ds-translator"
version = "0.1.0"
description = "Discord bot for translation, KingShot utilities, and gift-code automation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp==3.13.2",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "discord.py==2.6.4",
    "greenlet==3.3.0",
    "httpx==0.28.1",
    "openai==2.6.1",
    "pillow==13.0.0",
    "psycopg2-binary==2.9.10",
    "python-dotenv==1.2.1",
    "SQLAlchemy==2.0.36",
    "sqlalchemy-cockroachdb==2.0.2",
]

[dependency-groups]
dev = [
    # Only used by the one-off scripts in scripts/.
    "requests==2.32.5",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.18",
    "watchdog[watchmedo]==6.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
